[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conference-intelligence-pipeline"
version = "0.2.0"
description = "Evidence-linked extraction and normalization for conference programmes"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [{name = "Conference Intelligence"}]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "jsonschema>=4.23,<5",
  "lxml>=5,<7",
  "requests>=2.32,<3",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
conference-pipeline = "conference_pipeline.cli:main"

[tool.setuptools]
packages = ["conference_pipeline", "pipeline", "pipeline.kb", "pipeline.schema"]
include-package-data = true

[tool.setuptools.package-data]
pipeline = ["kb/*.json", "schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build", "data", "dist", "fixtures", "out", "pipeline", "reports", "run.py", "runs", "tests", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
